<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="26" viewBox="0 0 1200 26" role="presentation">
  <defs>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#800020" stop-opacity="0" />
      <stop offset=".32" stop-color="#800020" />
      <stop offset=".5" stop-color="#ffe78a" />
      <stop offset=".68" stop-color="#800020" />
      <stop offset="1" stop-color="#800020" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-500%" width="140%" height="1100%"><feGaussianBlur stdDeviation="3" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
  </defs>
  <path d="M0 13H1200" stroke="#800020" stroke-opacity=".35" />
  <rect x="0" y="11" width="360" height="4" rx="2" fill="url(#beam)" filter="url(#glow)">
    <animate attributeName="x" values="-360;1200" dur="3.2s" repeatCount="indefinite" />
  </rect>
  <circle cx="600" cy="13" r="4" fill="#d4af37" filter="url(#glow)"><animate attributeName="r" values="3;6;3" dur="1.8s" repeatCount="indefinite" /></circle>
</svg>
