<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">OpenCode, Claude Code and Codex</title>
  <desc id="desc">Animated agentic development stack</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11161d" />
      <stop offset="1" stop-color="#080b10" />
    </linearGradient>
    <linearGradient id="wine" x1="0" x2="1">
      <stop offset="0" stop-color="#5c0018" />
      <stop offset=".5" stop-color="#8a1538" />
      <stop offset="1" stop-color="#5c0018" />
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#8f6510" />
      <stop offset=".5" stop-color="#f4d76b" />
      <stop offset="1" stop-color="#8f6510" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#c9a227" stroke-opacity=".035" />
    </pattern>
    <style>
      .card{fill:url(#panel);stroke:#6e0b24;stroke-width:2}.card-accent{fill:url(#wine)}.card-gold{fill:url(#gold)}.name{fill:#f7f5f2;font:700 27px 'Segoe UI',Arial,sans-serif;letter-spacing:1px}.meta{fill:#c9a227;font:600 12px Consolas,monospace;letter-spacing:2.4px}.glyph{fill:#f6e7b0;font:700 30px Consolas,monospace}.wire{fill:none;stroke:#6e0b24;stroke-width:2;stroke-dasharray:8 15;animation:flow 5s linear infinite}.beam{fill:none;stroke:url(#gold);stroke-width:3;stroke-linecap:round;stroke-dasharray:4 190;filter:url(#glow);animation:beam 3.8s linear infinite}.node{fill:#c9a227;filter:url(#glow);animation:pulse 2s ease-in-out infinite}.card-group{animation:float 4s ease-in-out infinite}.card-group:nth-of-type(2){animation-delay:-1.3s}.card-group:nth-of-type(3){animation-delay:-2.6s}@keyframes flow{to{stroke-dashoffset:-230}}@keyframes beam{to{stroke-dashoffset:-388}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect x="6" y="6" width="1188" height="288" rx="26" fill="#0b0f14" stroke="#6e0b24" stroke-width="3" />
  <rect x="9" y="9" width="1182" height="282" rx="23" fill="url(#grid)" />
  <path class="wire" d="M345 151H470C520 151 530 90 600 90s80 61 130 61h125" />
  <path class="beam" d="M345 151H470C520 151 530 90 600 90s80 61 130 61h125" />
  <circle class="node" cx="600" cy="90" r="5" />
  <g class="card-group">
    <rect class="card" x="55" y="75" width="290" height="152" rx="20" />
    <rect class="card-accent" x="55" y="75" width="7" height="152" rx="3.5" />
    <circle cx="112" cy="126" r="27" fill="#6e0b24" />
    <text class="glyph" x="112" y="136" text-anchor="middle">&gt;_</text>
    <text class="name" x="158" y="128">OpenCode</text>
    <text class="meta" x="158" y="157">OPEN SOURCE</text>
    <path d="M91 190h218" stroke="#6e0b24" stroke-opacity=".55" />
    <circle cx="112" cy="190" r="4" fill="#c9a227"><animate attributeName="cx" values="112;290;112" dur="4s" repeatCount="indefinite" /></circle>
  </g>
  <g class="card-group">
    <rect class="card" x="455" y="75" width="290" height="152" rx="20" />
    <rect class="card-gold" x="455" y="75" width="7" height="152" rx="3.5" />
    <circle cx="512" cy="126" r="27" fill="#3a261d" stroke="#c9a227" stroke-opacity=".5" />
    <text class="glyph" x="512" y="136" text-anchor="middle">✦</text>
    <text class="name" x="558" y="128">Claude Code</text>
    <text class="meta" x="558" y="157">ANTHROPIC</text>
    <path d="M491 190h218" stroke="#c9a227" stroke-opacity=".35" />
    <circle cx="512" cy="190" r="4" fill="#c9a227"><animate attributeName="cx" values="512;690;512" dur="4.4s" repeatCount="indefinite" /></circle>
  </g>
  <g class="card-group">
    <rect class="card" x="855" y="75" width="290" height="152" rx="20" />
    <rect class="card-accent" x="855" y="75" width="7" height="152" rx="3.5" />
    <circle cx="912" cy="126" r="27" fill="#6e0b24" />
    <text class="glyph" x="912" y="136" text-anchor="middle">⌘</text>
    <text class="name" x="958" y="128">Codex</text>
    <text class="meta" x="958" y="157">OPENAI</text>
    <path d="M891 190h218" stroke="#6e0b24" stroke-opacity=".55" />
    <circle cx="912" cy="190" r="4" fill="#c9a227"><animate attributeName="cx" values="912;1090;912" dur="3.7s" repeatCount="indefinite" /></circle>
  </g>
</svg>
